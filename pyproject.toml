[project]
name = "extract-data-files"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pdferli>=0.11",
]

[tool.ruff]
extend-exclude = ["__pycache__"]
target-version = "py313"
line-length = 100
src = ["extract_data_files", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["extract_data_files", "config"]

[tool.ty.src]
include = ["extract_data_files", "tests"]
exclude = [
    "**/__pycache__/**",
    "**/scripts/**"
]
